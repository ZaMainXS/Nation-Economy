plugins {
    id 'fabric-loom' version '1.13.3'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

dependencies {
    // Minecraft itself
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Mojang official mappings (what Fabric API 0.141.6 builds against for 1.21.11)
    mappings loom.officialMojangMappings()
    // Fabric Loader & API (Loom 1.13 remaps intermediary artifacts to the Mojmap env)
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    // Keep fabric.mod.json static; nothing to expand right now.
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    // Minecraft 1.21.11 requires Java 21.
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

jar {
    inputs.property "archivesName", project.base.archivesName
}
