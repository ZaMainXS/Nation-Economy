plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

dependencies {
    // Minecraft itself (1.21.11 era: unobfuscated, Mojang names are native)
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Fabric Loader & API as plain dependencies (Loom 1.17 pipeline: no remapping needed)
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:${project.fabric_version}"
}

processResources {
    // Keep fabric.mod.json static; nothing to expand right now.
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    // Minecraft 1.21.11 requires Java 21.
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

jar {
    inputs.property "archivesName", project.base.archivesName
}
